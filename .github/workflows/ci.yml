name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Server und Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  headset:
    name: Brillen-App (Android)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: headset
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
          build-root-directory: headset
      - name: Kern der Brillen-App testen (JVM, ohne Android)
        working-directory: headset/core
        run: gradle test --no-daemon
      - run: ./gradlew assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: lernraumvr-debug-apk
          path: headset/app/build/outputs/apk/debug/*.apk
